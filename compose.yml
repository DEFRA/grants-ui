services:
  grants-ui:
    build:
      context: .
      target: ${BUILD_TARGET:-development}
    depends_on:
      redis:
        condition: service_healthy
      grants-ui-backend:
        condition: service_healthy
      fcp-defra-id-stub:
        condition: service_healthy
    ports:
      - '3000:3000'
      - '9229:9229'
    env_file:
      - 'localstack/aws.env'
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}
      ENVIRONMENT: local
      REDIS_HOST: redis
      USE_SINGLE_INSTANCE_CACHE: true
      SESSION_CACHE_ENGINE: redis
      REDIS_KEY_PREFIX: 'grants-ui:'
      SESSION_CACHE_NAME: session
      REDIS_CONNECT_TIMEOUT: 30000
      REDIS_RETRY_DELAY: 1000
      REDIS_MAX_RETRIES: 10
      REDIS_USERNAME: ''
      REDIS_PASSWORD: ''
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SESSION_COOKIE_PASSWORD: ${SESSION_COOKIE_PASSWORD:-53409gjhfcdiklgjidfglkgjidfglkelrku634}
      SESSION_COOKIE_TTL: ${SESSION_COOKIE_TTL:-2419200000}
      SESSION_CACHE_TTL: 14400000
      FEEDBACK_LINK: '${FEEDBACK_LINK:-mailto:defraforms@defra.gov.uk}'
      SERVICE_NAME: ${SERVICE_NAME:-Farm and land service}
      COOKIE_POLICY_URL: ${COOKIE_POLICY_URL:-/cookies}
      COOKIE_CONSENT_EXPIRY_DAYS: ${COOKIE_CONSENT_EXPIRY_DAYS:-365}
      CV_API_MOCK_ENABLED: ${CV_API_MOCK_ENABLED:-true}
      CV_API_ENDPOINT: '${CV_API_ENDPOINT:-}'
      CV_API_STUB_URL: '${CV_API_STUB_URL:-http://grants-ui-dal-stub:3008/graphql}'
      CV_API_DEVELOPER_KEY: '${CV_API_DEVELOPER_KEY:-}'
      ENTRA_INTERNAL_TOKEN_URL: '${ENTRA_INTERNAL_TOKEN_URL:-}'
      ENTRA_INTERNAL_TENANT_ID: '${ENTRA_INTERNAL_TENANT_ID:-}'
      ENTRA_INTERNAL_CLIENT_ID: '${ENTRA_INTERNAL_CLIENT_ID:-}'
      ENTRA_INTERNAL_CLIENT_SECRET: '${ENTRA_INTERNAL_CLIENT_SECRET:-}'
      DEFRA_ID_WELL_KNOWN_URL: '${DEFRA_ID_WELL_KNOWN_URL:-http://fcp-defra-id-stub:3007/idphub/b2c/b2c_1a_cui_cpdev_signupsigninsfi/.well-known/openid-configuration}'
      DEFRA_ID_CLIENT_ID: ${DEFRA_ID_CLIENT_ID:-client_id}
      DEFRA_ID_CLIENT_SECRET: ${DEFRA_ID_CLIENT_SECRET:-client_secret}
      DEFRA_ID_SERVICE_ID: ${DEFRA_ID_SERVICE_ID:-service_id}
      DEFRA_ID_REDIRECT_URL: '${DEFRA_ID_REDIRECT_URL:-http://localhost:3000/auth/sign-in-oidc}'
      DEFRA_ID_SIGN_OUT_REDIRECT_URL: '${DEFRA_ID_SIGN_OUT_REDIRECT_URL:-http://localhost:3000/auth/sign-out-oidc}'
      GRANTS_UI_BACKEND_URL: '${GRANTS_UI_BACKEND_URL:-http://grants-ui-backend:3001}'
      GRANTS_UI_BACKEND_AUTH_TOKEN: ${GRANTS_UI_BACKEND_AUTH_TOKEN:-auth_token}
      GRANTS_UI_BACKEND_ENCRYPTION_KEY: ${GRANTS_UI_BACKEND_ENCRYPTION_KEY:-encryption_key}
      GRANTS_UI_BACKEND_AUTH_JWT_SECRET: ${GRANTS_UI_BACKEND_AUTH_JWT_SECRET:-allowlist-jwt-secret}
      BACKEND_ALLOWLIST_ENABLED_SLUGS: ${BACKEND_ALLOWLIST_ENABLED_SLUGS:-example-whitelist,woodland,farm-payments,grasslands}
      APP_BASE_URL: '${APP_BASE_URL:-http://localhost:3000}'
      HOST: 0.0.0.0
      GAS_API_URL: '${GAS_API_URL:-http://mockserver:1080}'
      GAS_API_AUTH_TOKEN: '${GAS_API_AUTH_TOKEN}'
      LAND_GRANTS_API_URL: '${LAND_GRANTS_API_URL:-http://mockserver:1080}'
      LAND_GRANTS_API_AUTH_TOKEN: ${LAND_GRANTS_API_AUTH_TOKEN:-auth_token}
      LAND_GRANTS_API_ENCRYPTION_KEY: ${LAND_GRANTS_API_ENCRYPTION_KEY:-encryption_key}
      APPLICATION_LOCK_TOKEN_SECRET: ${APPLICATION_LOCK_TOKEN_SECRET:-dev-lock-secret}
      ENABLE_LAND_GRANT_SSSI_20260122: ${ENABLE_LAND_GRANT_SSSI_20260122:-true}
      ENABLE_LAND_GRANT_HEFER_20260219: ${ENABLE_LAND_GRANT_HEFER_20260219:-true}
      LAND_GRANTS_ENABLED_ACTIONS: ${LAND_GRANTS_ENABLED_ACTIONS:-CMOR1,UPL1,UPL2,UPL3,UPL8,UPL10,CLIG3}
      MAP_MOCK_DATA_ENABLED: ${MAP_MOCK_DATA_ENABLED:-true}
      OS_MAPS_API_KEY: ${OS_MAPS_API_KEY:-}
      BACKEND_FORM_DEF_ENABLED_SLUGS: ${BACKEND_FORM_DEF_ENABLED_SLUGS:-grasslands,woodland,farm-payments,example-grant-with-auth,example-grant-with-map,example-grant-with-task-list,example-grant-with-task-list-hide-questions,example-whitelist,pigs-might-fly}
      NOTIFICATION_BANNER_EXCLUDED_PATH_SUFFIXES: ${NOTIFICATION_BANNER_EXCLUDED_PATH_SUFFIXES:-/confirmation,/print-submitted-application}
      SFD_UPDATE_URL: '${SFD_UPDATE_URL:-http://localhost:3000/sfd/mock}'
      SFD_UPDATE_ENABLED: ${SFD_UPDATE_ENABLED:-false}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://localstack:4566}
      AWS_REGION: ${AWS_REGION:-eu-west-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AUDIT_ENABLED: ${AUDIT_ENABLED:-true}
      AUDIT_SNS_TOPIC_ARN: ${AUDIT_SNS_TOPIC_ARN:-arn:aws:sns:eu-west-2:000000000000:fcp_audit_events}
      AUDIT_APPLICATION: ${AUDIT_APPLICATION:-Grants}
      GA_TRACKING_ID: ${GA_TRACKING_ID:-GTM-WJ5C78H}
    volumes:
      - ./src:/home/node/src
      - /home/node/node_modules
    networks:
      - grants-ui-net
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
        ]
      interval: 30s
      start_interval: 1s
      timeout: 3s
      retries: 3
      start_period: 30s

  grants-ui-backend:
    image: defradigital/grants-ui-backend
    pull_policy: always
    depends_on:
      localstack:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      mongo-ready:
        condition: service_completed_successfully
      grants-config-broker:
        condition: service_healthy
    ports:
      - '3001:3001'
    env_file:
      - 'localstack/aws.env'
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      NODE_ENV: ${NODE_ENV:-development}
      MONGO_URI: mongodb://mongodb:27017/
      GRANTS_UI_BACKEND_AUTH_TOKEN: ${GRANTS_UI_BACKEND_AUTH_TOKEN:-auth_token}
      GRANTS_UI_BACKEND_ENCRYPTION_KEY: ${GRANTS_UI_BACKEND_ENCRYPTION_KEY:-encryption_key}
      ENCRYPTED_AUTH_JWT_SECRET: ${GRANTS_UI_BACKEND_AUTH_JWT_SECRET:-allowlist-jwt-secret}
      APPLICATION_LOCK_TOKEN_SECRET: ${APPLICATION_LOCK_TOKEN_SECRET:-dev-lock-secret}
      APPLICATION_LOCK_TTL_MS: ${APPLICATION_LOCK_TTL_MS:-14400000}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://localstack:4566}
      CONFIG_BROKER_BASE_URL: http://grants-config-broker:3012
      GRANTS_CONFIG_BROKER_AUTH_TOKEN: '${GRANTS_CONFIG_BROKER_AUTH_TOKEN:-config-broker-auth-token}'
      GRANTS_CONFIG_BROKER_ENCRYPTION_KEY: '${GRANTS_CONFIG_BROKER_ENCRYPTION_KEY:-config-broker-encryption-key}'
      CONFIG_INGEST_SQS_QUEUE_URL: http://localstack:4566/000000000000/grants_ui_backend__sqs__config_updates
    networks:
      - grants-ui-net
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/health']
      interval: 30s
      start_interval: 1s
      timeout: 3s
      retries: 3
      start_period: 30s

  grants-config-broker:
    image: defradigital/grants-config-broker:latest
    pull_policy: always
    ports:
      - '3012:3012'
    depends_on:
      localstack:
        condition: service_healthy
      mongo-ready:
        condition: service_completed_successfully
    env_file:
      - 'localstack/aws.env'
    environment:
      PORT: 3012
      NODE_ENV: development
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://localstack:4566}
      CONFIG_BUCKET_NAME: configs-bucket
      GRANTS_CONFIG_BROKER_AUTH_TOKEN: '${GRANTS_CONFIG_BROKER_AUTH_TOKEN:-config-broker-auth-token}'
      GRANTS_CONFIG_BROKER_ENCRYPTION_KEY: '${GRANTS_CONFIG_BROKER_ENCRYPTION_KEY:-config-broker-encryption-key}'
      MONGO_URI: mongodb://mongodb:27017/
      SERVICE_VERSION: 1.0.0
      CONFIG_INPUT_QUEUE_URL: http://localstack:4566/000000000000/gfr__sqs___config_input
    networks:
      - grants-ui-net
    volumes:
      - ./localstack/config-broker-local:/home/node/config
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3012/health']
      interval: 30s
      start_interval: 1s
      timeout: 3s
      retries: 3
      start_period: 30s

  fcp-defra-id-stub:
    image: defradigital/fcp-defra-id-stub:0.47.0
    networks:
      - grants-ui-net
    environment:
      WELL_KNOWN_HOST_OVERRIDE: '${WELL_KNOWN_HOST_OVERRIDE:-http://localhost:3007}'
      WELL_KNOWN_API_HOST_OVERRIDE: '${WELL_KNOWN_API_HOST_OVERRIDE:-http://fcp-defra-id-stub:3007}'
      PORT: 3007
      ALLOW_LOGIN_QUERY_PARAMS: ${ALLOW_LOGIN_QUERY_PARAMS:-true}
      AUTH_MODE: ${AUTH_MODE:-basic}
      AUTH_OVERRIDE: ${AUTH_OVERRIDE:-}
      AUTH_OVERRIDE_FILE: ${AUTH_OVERRIDE_FILE:-users.json}
    volumes:
      - ./fcp-defra-id-stub/users.json:/data/users.json
    ports:
      - '3007:3007'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3007/health']
      interval: 30s
      start_interval: 1s
      timeout: 3s
      retries: 3
      start_period: 10s

  grants-ui-dal-stub:
    image: defradigital/grants-ui-dal-stub:latest
    pull_policy: always
    ports:
      - '3008:3008'
    environment:
      PORT: 3008
      NODE_ENV: ${NODE_ENV:-development}
    networks:
      - grants-ui-net
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3008/health']
      interval: 30s
      start_interval: 1s
      timeout: 3s
      retries: 3
      start_period: 10s

  mockserver:
    image: mockserver/mockserver:5.15.0
    networks:
      - grants-ui-net
    environment:
      MOCKSERVER_INITIALIZATION_JSON_PATH: /config/expectations.json
    ports:
      - '1080:1080'
    volumes:
      - ./mockserver/expectations.json:/config/expectations.json
    command:
      - -serverPort 1080 -logLevel INFO

  redis:
    image: redis:7.2.3-alpine3.18
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    restart: always
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      start_interval: 1s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - grants-ui-net

  mongodb:
    image: mongo:7.0
    networks:
      - grants-ui-net
    ports:
      - '${MONGO_PORT:-27017}:27017'
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 30s
      start_interval: 1s
      timeout: 3s
      retries: 5
      start_period: 10s
    command: ['mongod', '--replSet', 'mongoRepl', '--bind_ip', 'localhost,mongodb']
    restart: always

  mongo-ready:
    image: mongo:7.0
    networks: [grants-ui-net]
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      PRIMARY: 'mongodb:27017'
      REPLSET: 'mongoRepl'
    volumes:
      - ./scripts/wait-for-replicaset.sh:/wait-for-replicaset.sh:ro
    entrypoint: ['/bin/bash', '/wait-for-replicaset.sh']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh "mongodb://mongodb:27017/?directConnection=true" --quiet --eval "db.hello().isWritablePrimary" | grep -q true'
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 5s

  localstack:
    image: localstack/localstack:4.14.0
    ports:
      - '4566:4566'
      - '4510-4559:4510-4559'
    env_file:
      - 'localstack/aws.env'
    environment:
      DEBUG: ${DEBUG:-0}
      LS_LOG: WARN
      SERVICES: s3,sqs,sns
      LOCALSTACK_HOST: 127.0.0.1
      SKIP_SSL_CERT_DOWNLOAD: 1
      DISABLE_EVENTS: 1
      DISABLE_USAGE_COLLECTION: 1
      LOCALSTACK_REQUIRED_S3_BUCKETS: configs-bucket
      LOCALSTACK_REQUIRED_SQS_QUEUES: fcp_audit,gfr__sqs___config_input,grants_ui_backend__sqs__config_updates
      LOCALSTACK_REQUIRED_SNS_TOPICS: fcp_audit_events,gfr__sns___config_update
    volumes:
      - localstack-data:/var/lib/localstack
      - ./localstack/start-localstack.sh:/etc/localstack/init/ready.d/start-localstack.sh
      - ./localstack/check-localstack-resources.sh:/usr/local/bin/check-localstack-resources.sh:ro
      - ./localstack/forms:/etc/localstack/forms:ro
    healthcheck:
      test: ['CMD-SHELL', '/usr/local/bin/check-localstack-resources.sh']
      interval: 2s
      start_period: 2s
      retries: 30
    networks:
      - grants-ui-net

volumes:
  redis-data:
  mongodb-data:
  mongodb-config:
  localstack-data:

networks:
  grants-ui-net:
    name: grants-ui-net
    driver: bridge
