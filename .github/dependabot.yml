# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    ignore:
      # eslint 10 is blocked by neostandard, which peers eslint ^9.0.0 on every published
      # version. Remove this rule when neostandard widens its eslint peer to include ^10.
      # (Verified the rules DO run under eslint 10 — this is purely a packaging block.)
      - dependency-name: "eslint"
        versions: [">=10.0.0"]
      # joi 18 is blocked by @defra/forms-engine-plugin, which deps joi ^17.13.3 (all versions,
      # incl. the 8.x major). Remove when forms-engine-plugin supports joi 18.
      - dependency-name: "joi"
        versions: [">=18.0.0"]
      # govuk-frontend 6 is blocked by @defra/forms-engine-plugin, which deps govuk-frontend ^5.x.
      # The repo's Sass-module migration for v6 is already done; remove when forms-engine-plugin
      # supports govuk-frontend 6.
      - dependency-name: "govuk-frontend"
        versions: [">=6.0.0"]
      # pino 10 is blocked by hapi-pino (latest 13.0.0 still deps pino ^9.9.0) and by the logging
      # stack bundled in @defra/forms-engine-plugin (deps pino ^9.14.0 + hapi-pino ^13.0.0).
      # Remove when hapi-pino ships a pino 10 release and forms-engine-plugin follows.
      - dependency-name: "pino"
        versions: [">=10.0.0"]
      # typescript 7 is blocked by @typescript-eslint, whose latest parser/plugin still peer
      # typescript ">=4.8.4 <6.1.0". tsx (esbuild) is unaffected. Remove when @typescript-eslint
      # widens its typescript peer to include 7.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
      # babel 8 is NOT blocked by any upstream peer (engines are fine, babel-loader allows ^8),
      # so it is intentionally held rather than auto-tracked in scripts/check-blocked-deps.mjs.
      # Local dev/watch runs via tsx and never exercises babel — only build:server (CI + deploy)
      # transpiles through babel, so a bump can look green locally yet break the built artifact.
      # Upgrade @babel/core, @babel/cli, @babel/preset-env and babel-plugin-transform-import-meta
      # together (transform-import-meta@3 peers @babel/core ^8.0.1) behind a full `npm run build`
      # plus a deployed-runtime smoke test, then remove these four rules.
      - dependency-name: "@babel/core"
        versions: [">=8.0.0"]
      - dependency-name: "@babel/cli"
        versions: [">=8.0.0"]
      - dependency-name: "@babel/preset-env"
        versions: [">=8.0.0"]
      - dependency-name: "babel-plugin-transform-import-meta"
        versions: [">=3.0.0"]
    groups:
      weekly-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
  # Update GitHub Actions
  - package-ecosystem: "github-actions"
    directory: /

    # Schedule run every Monday, local time
    schedule:
      interval: weekly
      time: '10:30'
      timezone: 'Europe/London'
