name: Notify Slack on Workflow Failure

# Posts an alert to #grants-ui-support when:
#   - one of the workflows listed below finishes with a failure. This runs after
#     the watched workflow completes, so it also catches failures that happen
#     outside a step (runner errors, failed job dependencies, reusable
#     workflows, release PR creation on merge).
#   - the SonarCloud quality gate fails on main. SonarCloud evaluates the gate
#     after the scan step has already passed and reports the result as its own
#     check on the commit, so it never fails the workflow itself.
#
# Requires a SLACK_WEBHOOK_URL secret holding the channel's incoming webhook.
#
# To test the alert without breaking a pipeline, run this workflow manually
# and pass the ID of any previous run (the number at the end of its URL).

on:
  workflow_run:
    workflows:
      - Publish
      - Publish Hot Fix
      - Check Blocked Dependencies
    types:
      - completed
  check_run:
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: 'ID of a previous workflow run to report on'
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  notify:
    name: Post failure to Slack
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'workflow_run' && contains(fromJSON('["failure", "timed_out"]'), github.event.workflow_run.conclusion))
      || (github.event_name == 'check_run' && github.event.check_run.conclusion == 'failure' && github.event.check_run.app.slug == 'sonarqubecloud')
    runs-on: ubuntu-latest
    steps:
      - name: Collect failure details
        id: failure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo
            const repoUrl = `${context.serverUrl}/${owner}/${repo}`
            const repoLink = `<${repoUrl}|${owner}/${repo}>`
            const failedConclusions = ['failure', 'timed_out']

            if (context.eventName === 'check_run') {
              const check = context.payload.check_run

              // Only alert for main. GitHub records the branch on the check suite
              // when it knows it; otherwise confirm the commit is in main's history.
              let branch = check.check_suite?.head_branch
              if (!branch) {
                const { data } = await github.rest.repos.compareCommits({ owner, repo, base: check.head_sha, head: 'main' })
                branch = ['identical', 'ahead'].includes(data.status) ? 'main' : null
              }
              if (branch !== 'main') {
                core.info(`Ignoring ${check.name} failure on ${branch || 'an unknown branch'}`)
                core.setOutput('skip', 'true')
                return
              }

              const { data: commit } = await github.rest.repos.getCommit({ owner, repo, ref: check.head_sha })
              const commitTitle = (commit.commit.message || '').split('\n')[0]
              const author = commit.author?.login || commit.commit.author?.name || 'unknown'

              // SonarCloud lists each failed condition as a markdown link followed by
              // the required threshold in brackets.
              const summary = check.output?.summary || ''
              const conditions = [...summary.matchAll(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)\s*(\([^)]*\))?/g)]
                .filter((m) => !/analysis details|SonarQube for IDE/i.test(m[1]))
                .map((m) => `• <${m[2]}|${m[1]}> ${m[3] || ''}`.trim())
              if (conditions.length === 0) {
                conditions.push(`• ${check.output?.title || 'Quality gate failed'}`)
              }

              core.setOutput('title', `:rotating_light: ${owner}/${repo}: ${check.name} failed on main`)
              core.setOutput('details', [
                `*Repository:* ${repoLink}`,
                `*Check:* <${check.html_url}|${check.name}> (${check.output?.title || check.conclusion})`,
                `*Commit:* <${repoUrl}/commit/${check.head_sha}|${check.head_sha.slice(0, 7)}> ${commitTitle}`,
                `*Author:* ${author}`,
                '*Failed conditions:*',
                ...conditions
              ].join('\n'))
              core.setOutput('link', `<${check.details_url || check.html_url}|View analysis>`)
              return
            }

            const isTest = context.eventName === 'workflow_dispatch'

            let run = context.payload.workflow_run
            if (!run) {
              const response = await github.rest.actions.getWorkflowRun({
                owner,
                repo,
                run_id: Number(context.payload.inputs.run_id)
              })
              run = response.data
            }

            // Use the workflow's own name: run.name holds the custom run-name in
            // repos that set one, which is the commit message in the config repos.
            const workflow = context.payload.workflow
              || (await github.rest.actions.getWorkflow({ owner, repo, workflow_id: run.workflow_id })).data

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner,
              repo,
              run_id: run.id,
              filter: 'latest',
              per_page: 100
            })

            const failedLines = jobs
              .filter((job) => failedConclusions.includes(job.conclusion))
              .map((job) => {
                const step = (job.steps || []).find((s) => failedConclusions.includes(s.conclusion))
                const label = step ? `${job.name} › ${step.name}` : job.name
                return `• <${job.html_url}|${label}>`
              })

            if (failedLines.length === 0) {
              failedLines.push('• No failed step recorded. The run may have failed before any step started.')
            }

            const shortSha = run.head_sha.slice(0, 7)
            const commitTitle = (run.head_commit?.message || '').split('\n')[0]
            const actor = run.triggering_actor?.login || run.actor?.login || 'unknown'

            const title = isTest
              ? `:test_tube: Test alert for ${owner}/${repo} (run ${run.run_number} was ${run.conclusion})`
              : `:rotating_light: ${owner}/${repo}: ${workflow.name} failed`

            core.setOutput('title', title)
            core.setOutput('details', [
              `*Repository:* ${repoLink}`,
              `*Workflow:* <${run.html_url}|${workflow.name} #${run.run_number}> (${run.event} on ${run.head_branch})`,
              `*Commit:* <${repoUrl}/commit/${run.head_sha}|${shortSha}> ${commitTitle}`,
              `*Triggered by:* ${actor}`,
              '*Failed:*',
              ...failedLines
            ].join('\n'))
            core.setOutput('link', `<${run.html_url}|View run>`)

      - name: Send Slack alert
        if: steps.failure.outputs.skip != 'true'
        uses: ravsamhq/notify-slack-action@be814b201e233b2dc673608aa46e5447c8ab13f2 # v2.5.0
        with:
          status: failure
          notify_when: failure
          notification_title: ${{ steps.failure.outputs.title }}
          message_format: ${{ steps.failure.outputs.details }}
          footer: ${{ steps.failure.outputs.link }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
