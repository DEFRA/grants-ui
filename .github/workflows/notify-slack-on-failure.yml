name: Notify Slack on Workflow Failure

# Posts an alert to #grants-ui-support when one of the workflows listed below
# finishes with a failure. It runs after the watched workflow completes, so it
# also catches failures that happen outside a step (runner errors, failed job
# dependencies, reusable workflows, release PR creation on merge).
#
# It also alerts when the SonarCloud quality gate fails on main. The scan step
# passes as soon as the analysis is uploaded, and SonarCloud reports the gate
# result later as its own check on the commit, so it never fails the workflow.
#
# Requires a SLACK_WEBHOOK_URL secret holding the channel's incoming webhook.
#
# To test the alert without breaking a pipeline, run this workflow manually
# and pass the ID of any previous run (the number at the end of its URL).
#
# Other Grants UI repositories reuse this file through workflow_call. Their
# caller workflow holds the triggers and the watched list; the event, the
# repository and the secret all come from the caller, so this logic runs
# unchanged for them. Changes here reach every repository on its next alert.

on:
  workflow_run:
    workflows:
      - Publish
      - Publish Hot Fix
      - Check Blocked Dependencies
    types:
      - completed
  check_run:
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: 'ID of a previous workflow run to report on'
        required: true
        type: string
  # Lets the other Grants UI repositories call this workflow. No inputs: the
  # event, repository and secret come from the caller.
  workflow_call:

permissions:
  actions: read

jobs:
  notify:
    name: Post failure to Slack
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'workflow_run' && contains(fromJSON('["failure", "timed_out"]'), github.event.workflow_run.conclusion))
      || (github.event_name == 'check_run' && github.event.check_run.conclusion == 'failure' && github.event.check_run.app.slug == 'sonarqubecloud' && github.event.check_run.check_suite.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Collect failure details
        id: failure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const failedConclusions = ['failure', 'timed_out']
            const { owner, repo } = context.repo
            const repoUrl = `${context.serverUrl}/${owner}/${repo}`
            // Slack requires these escaped in message text.
            const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            const isTest = context.eventName === 'workflow_dispatch'

            if (context.eventName === 'check_run') {
              const check = context.payload.check_run
              core.setOutput('title', `:rotating_light: ${owner}/${repo}: ${esc(check.name)} failed on ${check.check_suite.head_branch}`)
              core.setOutput('details', [
                `*Repository:* <${repoUrl}|${owner}/${repo}>`,
                `*Check:* <${check.html_url}|${esc(check.name)}> (${esc(check.output?.title || check.conclusion)})`
              ].join('\n'))
              core.setOutput('run_url', check.details_url || check.html_url)
              return
            }

            let run = context.payload.workflow_run
            if (!run) {
              const response = await github.rest.actions.getWorkflowRun({
                owner,
                repo,
                run_id: Number(context.payload.inputs.run_id)
              })
              run = response.data
            }

            // Use the workflow's own name: run.name holds the custom run-name in
            // repos that set one, which is the commit message in the config repos.
            const workflow = context.payload.workflow
              || (await github.rest.actions.getWorkflow({ owner, repo, workflow_id: run.workflow_id })).data

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner,
              repo,
              run_id: run.id,
              filter: 'latest',
              per_page: 100
            })

            const failedLines = jobs
              .filter((job) => failedConclusions.includes(job.conclusion))
              .map((job) => {
                const step = (job.steps || []).find((s) => failedConclusions.includes(s.conclusion))
                const label = esc(step ? `${job.name} › ${step.name}` : job.name)
                return `• <${job.html_url}|${label}>`
              })

            if (failedLines.length === 0) {
              failedLines.push('• No failed step recorded. The run may have failed before any step started.')
            }

            const title = isTest
              ? `:test_tube: Test alert for ${owner}/${repo} (run ${run.run_number} was ${run.conclusion})`
              : `:rotating_light: ${owner}/${repo}: ${esc(workflow.name)} failed`

            const details = [
              `*Repository:* <${repoUrl}|${owner}/${repo}>`,
              `*Workflow:* <${run.html_url}|${esc(workflow.name)} #${run.run_number}>`,
              '*Failed step:*',
              ...failedLines
            ].join('\n')

            core.setOutput('title', title)
            core.setOutput('details', details)
            core.setOutput('run_url', run.html_url)

      - name: Send Slack alert
        uses: ravsamhq/notify-slack-action@be814b201e233b2dc673608aa46e5447c8ab13f2 # v2.5.0
        with:
          status: failure
          notify_when: failure
          notification_title: ${{ steps.failure.outputs.title }}
          message_format: ${{ steps.failure.outputs.details }}
          footer: '<${{ steps.failure.outputs.run_url }}|View details>'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
