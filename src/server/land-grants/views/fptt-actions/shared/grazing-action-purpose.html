<p class="govuk-body">The purpose of this is to:</p>
<ul class="govuk-list govuk-list--bullet">
  <li>prevent expansion of areas of bare ground</li>
  <li>increase surface roughness</li>
  <li>reduce diffuse pollution</li>
  <li>improve water quality and flood risk management</li>
  <li>provide habitats for moorland species</li>
  <li>protect historic and archaeological features</li>
</ul>
