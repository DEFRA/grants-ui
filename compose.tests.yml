services:
  grants-ui-acceptance-tests:
    build: ./acceptance
    environment:
      MAX_INSTANCES: ${MAX_INSTANCES:-3}
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/nginx.crt
      BASE_URL: https://grants-ui-proxy:4000
      BASE_BACKEND_URL: https://grants-ui-proxy:4001
      GRANTS_UI_BACKEND_AUTH_TOKEN: ${GRANTS_UI_BACKEND_AUTH_TOKEN:-auth_token}
      GRANTS_UI_BACKEND_ENCRYPTION_KEY: ${GRANTS_UI_BACKEND_ENCRYPTION_KEY:-encryption_key}
      APPLICATION_LOCK_TOKEN_SECRET: ${APPLICATION_LOCK_TOKEN_SECRET:-dev-lock-secret}
      AGREEMENTS_JWT_SECRET: ${AGREEMENTS_JWT_SECRET:-agreements-jwt-secret}
      AGREEMENTS_JWT_ISSUER: ${AGREEMENTS_JWT_ISSUER:-grants-ui}
      AGREEMENTS_JWT_TTL_SEC: ${AGREEMENTS_JWT_TTL_SEC:-300}
      DEFRA_ID_USER_PASSWORD: x
      MOCKSERVER_HOST: mockserver
      MOCKSERVER_PORT: 1080
      FLOCI_ENDPOINT: http://floci:4566
      AUDIT_SNS_TOPIC_ARN: ${AUDIT_SNS_TOPIC_ARN:-arn:aws:sns:eu-west-2:000000000000:fcp_audit_events}
      MONGO_URI: mongodb://mongodb:27017/
    volumes:
      - ./nginx/certs:/etc/ssl/certs:ro
      - ./acceptance/schemas:/home/node/app/schemas:ro
    command: ['npm', 'run', 'test:ci']
    networks:
      - grants-ui-net

  grants-ui-grasslands-tests:
    image: defradigital/grants-ui-grasslands-tests
    pull_policy: always
    environment:
      MAX_INSTANCES: 3
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/nginx.crt
      BASE_URL: https://grants-ui-proxy:4000
      BASE_BACKEND_URL: https://grants-ui-proxy:4001
      GRANTS_UI_BACKEND_AUTH_TOKEN: ${GRANTS_UI_BACKEND_AUTH_TOKEN:-auth_token}
      GRANTS_UI_BACKEND_ENCRYPTION_KEY: ${GRANTS_UI_BACKEND_ENCRYPTION_KEY:-encryption_key}
      MOCKSERVER_HOST: mockserver
      MOCKSERVER_PORT: 1080
      MONGO_URI: mongodb://mongodb:27017/
    volumes:
      - ./nginx/certs:/etc/ssl/certs:ro
      - ./grants-ui-grasslands-tests-schemas:/app/test/schemas:ro
    command: ['npm', 'run', 'test:ci']
    networks:
      - grants-ui-net

  grants-ui-woodland-tests:
    image: defradigital/grants-ui-woodland-tests
    pull_policy: always
    environment:
      MAX_INSTANCES: 3
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/nginx.crt
      BASE_URL: https://grants-ui-proxy:4000
      BASE_BACKEND_URL: https://grants-ui-proxy:4001
      GRANTS_UI_BACKEND_AUTH_TOKEN: ${GRANTS_UI_BACKEND_AUTH_TOKEN:-auth_token}
      GRANTS_UI_BACKEND_ENCRYPTION_KEY: ${GRANTS_UI_BACKEND_ENCRYPTION_KEY:-encryption_key}
      MOCKSERVER_HOST: mockserver
      MOCKSERVER_PORT: 1080
      MONGO_URI: mongodb://mongodb:27017/
    volumes:
      - ./nginx/certs:/etc/ssl/certs:ro
      - ./grants-ui-woodland-tests-schemas:/app/test/schemas:ro
    command: ['npm', 'run', 'test:ci']
    networks:
      - grants-ui-net

networks:
  grants-ui-net:
    name: grants-ui-net
    external: true
