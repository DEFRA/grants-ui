services:
  grants-ui:
    build:
      context: .
      target: ${BUILD_TARGET:-development}
    depends_on:
      redis:
        condition: service_healthy
      grants-ui-backend:
        condition: service_healthy
      fcp-defra-id-stub:
        condition: service_healthy
    ports:
      - '3000:3000'
      - '9229:9229'
    env_file:
      - 'compose/aws.env'
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}
      ENVIRONMENT: local
      REDIS_HOST: redis
      USE_SINGLE_INSTANCE_CACHE: true
      SESSION_CACHE_ENGINE: redis
      REDIS_KEY_PREFIX: 'grants-ui:'
      SESSION_CACHE_NAME: session
      REDIS_CONNECT_TIMEOUT: 30000
      REDIS_RETRY_DELAY: 1000
      REDIS_MAX_RETRIES: 10
      REDIS_USERNAME: ''
      REDIS_PASSWORD: ''
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SESSION_COOKIE_PASSWORD: ${SESSION_COOKIE_PASSWORD:-53409gjhfcdiklgjidfglkgjidfglkelrku634}
      SESSION_COOKIE_TTL: ${SESSION_COOKIE_TTL:-2419200000}
      SESSION_CACHE_TTL: 14400000
      FEEDBACK_LINK: '${FEEDBACK_LINK:-mailto:defraforms@defra.gov.uk}'
      SERVICE_NAME: ${SERVICE_NAME:-Farm and land service}
      COOKIE_POLICY_URL: ${COOKIE_POLICY_URL:-/cookies}
      COOKIE_CONSENT_EXPIRY_DAYS: ${COOKIE_CONSENT_EXPIRY_DAYS:-365}
      CV_API_MOCK_ENABLED: ${CV_API_MOCK_ENABLED:-true}
      CV_API_ENDPOINT: '${CV_API_ENDPOINT:-}'
      CV_API_STUB_URL: '${CV_API_STUB_URL:-http://grants-ui-dal-stub:3008/graphql}'
      CV_API_DEVELOPER_KEY: '${CV_API_DEVELOPER_KEY:-}'
      ENTRA_INTERNAL_TOKEN_URL: '${ENTRA_INTERNAL_TOKEN_URL:-}'
      ENTRA_INTERNAL_TENANT_ID: '${ENTRA_INTERNAL_TENANT_ID:-}'
      ENTRA_INTERNAL_CLIENT_ID: '${ENTRA_INTERNAL_CLIENT_ID:-}'
      ENTRA_INTERNAL_CLIENT_SECRET: '${ENTRA_INTERNAL_CLIENT_SECRET:-}'
      DEFRA_ID_WELL_KNOWN_URL: '${DEFRA_ID_WELL_KNOWN_URL:-http://fcp-defra-id-stub:3007/idphub/b2c/b2c_1a_cui_cpdev_signupsigninsfi/.well-known/openid-configuration}'
      DEFRA_ID_CLIENT_ID: ${DEFRA_ID_CLIENT_ID:-client_id}
      DEFRA_ID_CLIENT_SECRET: ${DEFRA_ID_CLIENT_SECRET:-client_secret}
      DEFRA_ID_SERVICE_ID: ${DEFRA_ID_SERVICE_ID:-service_id}
      DEFRA_ID_REDIRECT_URL: '${DEFRA_ID_REDIRECT_URL:-http://localhost:3000/auth/sign-in-oidc}'
      DEFRA_ID_SIGN_OUT_REDIRECT_URL: '${DEFRA_ID_SIGN_OUT_REDIRECT_URL:-http://localhost:3000/auth/sign-out-oidc}'
      GRANTS_UI_BACKEND_URL: '${GRANTS_UI_BACKEND_URL:-http://grants-ui-backend:3001}'
      GRANTS_UI_BACKEND_AUTH_TOKEN: ${GRANTS_UI_BACKEND_AUTH_TOKEN:-auth_token}
      GRANTS_UI_BACKEND_ENCRYPTION_KEY: ${GRANTS_UI_BACKEND_ENCRYPTION_KEY:-encryption_key}
      GRANTS_UI_BACKEND_AUTH_JWT_SECRET: ${GRANTS_UI_BACKEND_AUTH_JWT_SECRET:-allowlist-jwt-secret}
      APP_BASE_URL: '${APP_BASE_URL:-http://localhost:3000}'
      HOST: 0.0.0.0
      GAS_API_URL: '${GAS_API_URL:-http://mockserver:1080}'
      GAS_API_AUTH_TOKEN: '${GAS_API_AUTH_TOKEN}'
      LAND_GRANTS_API_URL: '${LAND_GRANTS_API_URL:-http://mockserver:1080}'
      LAND_GRANTS_API_AUTH_TOKEN: ${LAND_GRANTS_API_AUTH_TOKEN:-auth_token}
      LAND_GRANTS_API_ENCRYPTION_KEY: ${LAND_GRANTS_API_ENCRYPTION_KEY:-encryption_key}
      APPLICATION_LOCK_TOKEN_SECRET: ${APPLICATION_LOCK_TOKEN_SECRET:-dev-lock-secret}
      ENABLE_LAND_GRANT_SSSI_20260122: ${ENABLE_LAND_GRANT_SSSI_20260122:-true}
      ENABLE_LAND_GRANT_HEFER_20260219: ${ENABLE_LAND_GRANT_HEFER_20260219:-true}
      MAP_MOCK_DATA_ENABLED: ${MAP_MOCK_DATA_ENABLED:-true}
      OS_MAPS_API_KEY: ${OS_MAPS_API_KEY:-your-key-here}
      OS_MAPS_BASE_URL: '${OS_MAPS_BASE_URL:-https://api.os.uk/maps/raster/v1/zxy}'
      MAP_TILE_CACHE_MAX_AGE_SECONDS: ${MAP_TILE_CACHE_MAX_AGE_SECONDS:-3600}
      NOTIFICATION_BANNER_EXCLUDED_PATH_SUFFIXES: ${NOTIFICATION_BANNER_EXCLUDED_PATH_SUFFIXES:-/confirmation,/print-submitted-application}
      QUANTITY_REQUIRED_ACTION_CODES: ${QUANTITY_REQUIRED_ACTION_CODES:-CSAM3}
      SFD_UPDATE_URL: '${SFD_UPDATE_URL:-http://localhost:3000/sfd/mock}'
      SFD_UPDATE_ENABLED: ${SFD_UPDATE_ENABLED:-false}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://floci:4566}
      AWS_REGION: ${AWS_REGION:-eu-west-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AUDIT_ENABLED: ${AUDIT_ENABLED:-true}
      AUDIT_SNS_TOPIC_ARN: ${AUDIT_SNS_TOPIC_ARN:-arn:aws:sns:eu-west-2:000000000000:fcp_audit_events}
      AUDIT_APPLICATION: ${AUDIT_APPLICATION:-Grants}
      GA_TRACKING_ID: ${GA_TRACKING_ID:-GTM-WJ5C78H}
    volumes:
      - ./src:/home/node/src
      - /home/node/node_modules
    networks:
      - grants-ui-net
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
        ]
      interval: 30s
      start_interval: 1s
      timeout: 3s
      retries: 3
      start_period: 30s

  grants-ui-backend:
    image: defradigital/grants-ui-backend
    pull_policy: always
    depends_on:
      floci:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      mongo-ready:
        condition: service_completed_successfully
      grants-config-broker:
        condition: service_healthy
    ports:
      - '3001:3001'
    env_file:
      - 'compose/aws.env'
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      NODE_ENV: ${NODE_ENV:-development}
      MONGO_URI: mongodb://mongodb:27017/
      GRANTS_UI_BACKEND_AUTH_TOKEN: ${GRANTS_UI_BACKEND_AUTH_TOKEN:-auth_token}
      GRANTS_UI_BACKEND_ENCRYPTION_KEY: ${GRANTS_UI_BACKEND_ENCRYPTION_KEY:-encryption_key}
      ENCRYPTED_AUTH_JWT_SECRET: ${GRANTS_UI_BACKEND_AUTH_JWT_SECRET:-allowlist-jwt-secret}
      APPLICATION_LOCK_TOKEN_SECRET: ${APPLICATION_LOCK_TOKEN_SECRET:-dev-lock-secret}
      APPLICATION_LOCK_TTL_MS: ${APPLICATION_LOCK_TTL_MS:-14400000}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://floci:4566}
      CONFIG_BROKER_BASE_URL: http://grants-config-broker:3012
      GRANTS_CONFIG_BROKER_AUTH_TOKEN: '${GRANTS_CONFIG_BROKER_AUTH_TOKEN:-config-broker-auth-token}'
      GRANTS_CONFIG_BROKER_ENCRYPTION_KEY: '${GRANTS_CONFIG_BROKER_ENCRYPTION_KEY:-config-broker-encryption-key}'
      CONFIG_INGEST_SQS_QUEUE_URL: http://floci:4566/000000000000/grants_ui_backend__sqs__config_updates
    networks:
      - grants-ui-net
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/health']
      interval: 30s
      start_interval: 1s
      timeout: 3s
      retries: 3
      start_period: 30s

  grants-config-broker:
    image: defradigital/grants-config-broker:latest
    pull_policy: always
    ports:
      - '3012:3012'
    depends_on:
      floci:
        condition: service_healthy
      mongo-ready:
        condition: service_completed_successfully
    env_file:
      - 'compose/aws.env'
    environment:
      PORT: 3012
      NODE_ENV: development
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://floci:4566}
      CONFIG_BUCKET_NAME: configs-bucket
      GRANTS_CONFIG_BROKER_AUTH_TOKEN: '${GRANTS_CONFIG_BROKER_AUTH_TOKEN:-config-broker-auth-token}'
      GRANTS_CONFIG_BROKER_ENCRYPTION_KEY: '${GRANTS_CONFIG_BROKER_ENCRYPTION_KEY:-config-broker-encryption-key}'
      MONGO_URI: mongodb://mongodb:27017/
      SERVICE_VERSION: 1.0.0
      CONFIG_INPUT_QUEUE_URL: http://floci:4566/000000000000/gfr__sqs___config_input
      SERVICE_AUTH_ENABLED: false
      AUDIT_ENABLED: false
    networks:
      - grants-ui-net
    volumes:
      - ./compose/config-broker-local:/home/node/config
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3012/health']
      interval: 30s
      start_interval: 1s
      timeout: 3s
      retries: 3
      start_period: 30s

