services:
  grants-ui:
    depends_on:
      grants-scoring-api:
        condition: service_healthy
    environment:
      SCORING_SERVICE_URL: http://grants-scoring-api:3013

  grants-scoring-api:
    image: defradigital/grants-scoring-api:latest
    pull_policy: always
    ports:
      - '3013:3013'
    depends_on:
      floci:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      mongo-ready:
        condition: service_completed_successfully
    env_file:
      - 'compose/aws.env'
    environment:
      PORT: 3013
      NODE_ENV: development
      MONGO_URI: mongodb://mongodb:27017/
    networks:
      - grants-ui-net
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3013/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
        ]
      interval: 30s
      start_interval: 1s
      timeout: 3s
      retries: 3
      start_period: 30s
