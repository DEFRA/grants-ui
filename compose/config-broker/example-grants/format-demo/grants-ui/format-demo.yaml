engine: V2
name: Format demo
startPage: /start
metadata:
  id: ea67ffb4-7986-4ff9-9492-cc1dbb4bcc66
  shortName: Format demo
  enabledInProd: false
  referenceNumberPrefix: FMT
  submission:
    grantCode: format-demo
  permissions:
    enforce: true
    resource: businessDetails
    pageAccess:
      default: submit
  grantRedirectRules:
    preSubmission: []
pages:
  - title: Enter numbers to format
    path: /start
    id: e3c593fd-7150-4748-a34c-926d8027ca56
    components:
      - name: sterlingAmount
        id: c5c2d03e-9cd9-4fb0-8394-3bca07860413
        type: NumberField
        title: Amount in pounds sterling
        shortDescription: Currency (currency:gbp)
        hint: Enter an amount without commas, for example 125000.50.
        options:
          required: true
          prefix: £
          classes: govuk-!-width-one-third
        schema:
          min: 0
          precision: 2
          format: currency:gbp
      - name: volumeCubicMetres
        id: 19b16250-7d01-4b58-af75-9fc49ef7f912
        type: NumberField
        title: Volume in cubic metres
        shortDescription: Volume in m³ (no format)
        hint: Enter a volume without commas, for example 125000.
        options:
          required: true
          suffix: m³
          classes: govuk-!-width-one-third
        schema:
          min: 0
          precision: 2
      - name: groupedNumber
        id: c2e20fd9-f93f-4c96-ab83-7863c6a65c68
        type: NumberField
        title: Number with thousands separators
        shortDescription: Thousands separators (thousands)
        hint: Enter a number without commas, for example 1234567.8900. Entered decimal places are preserved on the next page.
        options:
          required: true
          classes: govuk-!-width-one-third
        schema:
          precision: 4
          format: thousands
      - name: decimalNumber
        id: 8bb836c9-77db-4933-a221-ed2a29b70573
        type: NumberField
        title: Decimal number
        shortDescription: Two decimal places (decimal)
        hint: Enter a number without commas, for example 1234567.895. The next page rounds it to two decimal places.
        options:
          required: true
          classes: govuk-!-width-one-third
        schema:
          precision: 4
          format: decimal
      - name: percentageFraction
        id: e48c43da-b49f-4146-9d96-9907432e3bd6
        type: NumberField
        title: Percentage as a fraction
        shortDescription: Percentage (percent)
        hint: Enter a fraction, for example 0.125 for 12.5%. The next page displays up to two decimal places.
        options:
          required: true
          classes: govuk-!-width-one-third
        schema:
          precision: 5
          format: percent
      - name: precisePercentage
        id: 7e6f5a4b-3c2d-4f0e-9a8b-6c5d4e3f2a10
        type: NumberField
        title: Percentage with four decimal places
        shortDescription: Four-decimal percentage (percent:4)
        hint: Enter 0.125 to see 12.5000% on the next page.
        options:
          required: true
          classes: govuk-!-width-one-third
        schema:
          precision: 5
          format: percent:4
      - name: explicitCurrency
        id: 9b8c7d6e-5f4a-4b2c-9d0e-8f7a6b5c4d32
        type: NumberField
        title: Currency with explicit precision
        shortDescription: Four-decimal currency (currency:gbp,4)
        hint: Enter 125000.5 to see £125,000.5000 on the next page.
        options:
          required: true
          classes: govuk-!-width-one-third
        schema:
          min: 0
          precision: 4
          format: currency:gbp,4
  - title: Check your formatted numbers
    path: /summary
    id: 640b5040-a802-40e7-a372-a1846b533a25
    controller: CheckResponsesPageController
    config:
      width: full
    next:
      - path: /start
sections: []
lists: []
conditions: []
schema: 2
