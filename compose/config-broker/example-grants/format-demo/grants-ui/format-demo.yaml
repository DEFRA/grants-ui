engine: V2
name: Format demo
startPage: /start
metadata:
  id: ea67ffb4-7986-4ff9-9492-cc1dbb4bcc66
  shortName: Format demo
  enabledInProd: false
  referenceNumberPrefix: FMT
  submission:
    grantCode: format-demo
  permissions:
    enforce: true
    resource: businessDetails
    pageAccess:
      default: submit
  grantRedirectRules:
    preSubmission: []
pages:
  - title: Enter numbers to format
    path: /start
    id: e3c593fd-7150-4748-a34c-926d8027ca56
    components:
      - name: sterlingAmount
        id: c5c2d03e-9cd9-4fb0-8394-3bca07860413
        type: NumberField
        title: Amount in pounds sterling
        shortDescription: Currency (currency:gbp)
        hint: Enter an amount without commas.
        options:
          required: true
          prefix: £
          classes: govuk-!-width-one-third
          format: currency:gbp
        schema:
          min: 0
          precision: 2
      - name: volumeCubicMetres
        id: 19b16250-7d01-4b58-af75-9fc49ef7f912
        type: NumberField
        title: Volume in cubic metres
        shortDescription: Volume in m³ (no format)
        hint: Enter a volume without commas, for example 125000.
        options:
          required: true
          suffix: m³
          classes: govuk-!-width-one-third
        schema:
          min: 0
          precision: 2
      - name: groupedNumber
        id: c2e20fd9-f93f-4c96-ab83-7863c6a65c68
        type: NumberField
        title: Number with thousands separators
        shortDescription: Thousands separators (thousands)
        hint: Enter a number without commas.
        options:
          required: true
          classes: govuk-!-width-one-third
          format: thousands
        schema:
          min: 0
          precision: 4
      - name: decimalNumber
        id: 8bb836c9-77db-4933-a221-ed2a29b70573
        type: NumberField
        title: Decimal number
        shortDescription: Two decimal places (decimal)
        hint: Enter a number without commas.
        options:
          required: true
          classes: govuk-!-width-one-third
          format: decimal
        schema:
          min: 1
          precision: 4
  - title: Check your formatted numbers
    path: /summary
    id: 640b5040-a802-40e7-a372-a1846b533a25
    controller: CheckResponsesPageController
    config:
      width: full
    next:
      - path: /start
sections: []
lists: []
conditions: []
schema: 2
