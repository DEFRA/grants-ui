engine: V2
name: Example grant with map
metadata:
  id: 3a7f1c2e-8b4d-4e9a-b5f6-c2d3e4f5a6b7
  surveyLabel: Example grant with map
  enabledInProd: false
  enabledLandActions:
    - 'CLIG3_26'
    - 'CNUM2_26'
    - 'CSAM3_26'
    - 'HEF1_26'
    - 'SCR2_26'
    - 'WBD1_26'
  grantRedirectRules:
    preSubmission:
      - toPath: /summary
        requiresAnyItemWithNonEmptyKey:
          collection: landParcels
          key: actionsObj
        incompleteToPath: /select-land-parcel
  referenceNumberPrefix: EGWM
  supportEmail: support@defra.gov.uk
  cookieConsent:
    enabled: true
    serviceName: Farm and land service
    cookiePolicyUrl: /cookies
    expiryDays: 365
  permissions:
    enforce: false
pages:
  - title: Apply for Example Grant with Map
    id: a1b2c3d4-0001-0001-0001-000000000001
    path: /start
    controller: StartPageController
    components:
      - name: introHtml
        id: a1b2c3d4-0001-0001-0001-000000000002
        type: Html
        content: |
          <p class="govuk-body">
            This example grant demonstrates the Defra interactive map component.
          </p>
          <p class="govuk-body">You will:</p>
          <ul class="govuk-list govuk-list--bullet">
            <li>select a land parcel on an interactive map</li>
            <li>select actions for that land parcel</li>
            <li>check your land, actions and payment</li>
            <li>submit your application</li>
          </ul>
  - title: Select a land parcel
    id: a1b2c3d4-0001-0001-0001-000000000003
    path: /select-land-parcel
    controller: MapSelectPageController
    config:
      devMode: true
    components:
      - name: selectedParcelsDisplay
        id: a1b2c3d4-0001-0001-0001-000000000010
        type: HiddenField
        title: Land parcel
        shortDescription: Land parcel
        options:
          required: false

  - title: Select actions for land parcel
    id: a1b2c3d4-0001-0001-0001-000000000004
    path: /select-actions-for-land-parcel
    controller: SelectActionsPageController
    config:
      links:
        sfi_hefer:
          href: https://www.gov.uk/government/publications/sustainable-farming-incentive-2026-sfi26/sfi26-scheme-rules-and-guidance#how-to-request-an-sfi-hefer
        sssi_consent:
          href: https://www.gov.uk/government/publications/sustainable-farming-incentive-2026-sfi26/sfi26-scheme-rules-and-guidance#sssi-consent

  - title: Your land and actions
    id: a1b2c3d4-0001-0001-0001-000000000012
    path: /confirm-land-and-actions
    controller: ConfirmLandAndActionsPageController
    config:
      redirects:
        next: /summary
        addAnotherLandParcel: /select-land-parcel

  - title: Check your answers
    id: a1b2c3d4-0001-0001-0001-000000000011
    path: /summary
    controller: MapSubmissionPageController

  - title: Confirmation
    id: a1b2c3d4-0001-0001-0001-000000000006
    path: /confirmation
    controller: ConfirmationPageController
    config:
      panelTitle: Application submitted
      panelText: Your reference number
    components:
      - name: confirmationContent
        id: b0066d47-e7dc-4eda-9df4-6434abb8eac5
        type: Html
        content: |
          <h2 class="govuk-heading-m">What happens next</h2>
          <p class="govuk-body">Defra will review your selected land parcel and contact you within 5 working days.</p>

  - title: Remove land parcel
    id: a1b2c3d4-0001-0001-0001-000000000013
    path: /remove-parcel
    controller: RemoveActionPageController
    config:
      returnPath: /confirm-land-and-actions

  - title: Remove action
    id: a1b2c3d4-0001-0001-0001-000000000014
    path: /remove-action
    controller: RemoveActionPageController
    config:
      returnPath: /confirm-land-and-actions

sections: []
lists: []
conditions: []
